<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Access | Exclusive</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💎</text></svg>">
    <style>
        :root {
            --primary: #ff0055;
            --secondary: #00e5ff;
            --glass-bg: rgba(20, 20, 20, 0.45);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
            --shadow-color: rgba(0, 0, 0, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #050505;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            color: var(--text-main);
        }

        /* --- VIDEO BACKGROUND --- */
        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            /* Sedikit blur agar teks terbaca, tapi video tetap terlihat jelas */
            filter: brightness(0.5) blur(3px); 
            transform: scale(1.05);
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.8) 90%);
            z-index: -1;
            pointer-events: none;
        }

        /* --- CARD UI --- */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 90%;
            max-width: 360px;
            border-radius: 30px;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            z-index: 10;
            border: 1px solid var(--glass-border);
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.8),
                inset 0 0 20px rgba(255, 255, 255, 0.05);
            
            /* Animation */
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            animation: cardEntrance 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes cardEntrance {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* --- PROFILE --- */
        .profile-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 25px;
        }

        .profile-ring {
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%;
            border: 2px solid transparent;
            background: linear-gradient(45deg, var(--primary), var(--secondary)) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
            animation: spinRing 4s linear infinite;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(30, 30, 30, 0.6);
            position: relative;
            z-index: 2;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .profile-wrapper:hover .profile-img {
            transform: scale(1.08);
        }

        .badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: #1e1e1e;
            color: var(--secondary);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            z-index: 3;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 1px solid var(--secondary);
        }

        /* --- TYPOGRAPHY --- */
        .user-name {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 5px;
            background: linear-gradient(to right, #fff, #e0e0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .user-handle {
            font-size: 0.9rem;
            color: var(--secondary);
            font-weight: 500;
            margin-bottom: 15px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bio-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .bio-text {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* --- BUTTON --- */
        .btn-container {
            position: relative;
        }

        .action-btn {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, var(--primary) 0%, #990033 100%);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            position: relative;
            z-index: 1;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(255, 0, 85, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.5s;
            z-index: -1;
        }

        .action-btn:hover::before {
            left: 100%;
        }

        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255, 0, 85, 0.5);
        }

        .notification-dot {
            width: 8px;
            height: 8px;
            background-color: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff88;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        @media (max-width: 480px) {
            .glass-card { width: 95%; padding: 30px 20px; }
            .video-bg { filter: brightness(0.6) blur(2px); }
        }
    </style>
</head>
<body>

    <!-- Video Background (Source diisi oleh JS) -->
    <video id="bgVideo" class="video-bg" autoplay muted loop playsinline></video>
    
    <!-- Overlay -->
    <div class="vignette"></div>

    <div class="glass-card">
        <div class="profile-wrapper" onclick="redirectUser()">
            <div class="profile-ring"></div>
            <img id="randomProfileImg" class="profile-img" src="" alt="Profile">
            <div class="badge">✓</div>
        </div>

        <h1 id="userName" class="user-name">Loading...</h1>
        <span class="user-handle">@exclusive_vip</span>

        <div class="bio-box">
            <p class="bio-text">"Connecting to private secure channel. Please wait while we verify your access."</p>
        </div>

        <div class="btn-container">
            <button class="action-btn" onclick="redirectUser()">
                <span>Continue Now</span>
                <div class="notification-dot"></div>
            </button>
        </div>
    </div>

    <script>
        // --- 1. DATABASE GAMBAR ---
        const photoList = [
            "https://files.catbox.moe/p9uwso.png",
            "https://files.catbox.moe/0s5wni.png",
            "https://files.catbox.moe/2hg2st.png",
            "https://files.catbox.moe/i4bygx.png",
            "https://files.catbox.moe/tebpm0.png",
            "https://files.catbox.moe/ghpyfa.png",
            "https://files.catbox.moe/5rj761.jpg",
            "https://files.catbox.moe/2kj1da.png",
            "https://files.catbox.moe/7k81uw.png",
            "https://files.catbox.moe/07pxbl.png"
        ];

        const fullNames = [
            "Emilia Hernandez", "Sophia Laurent", "Charlotte Davis",
            "Victoria Beckham", "Camille Stone", "Isabella Ross",
            "Grace Parker", "Natalie Cole", "Aria Montgomery", "Stella Nova"
        ];

        // --- 2. DATABASE VIDEO ---
        const videoList = [
            "https://ceafgif.flirtpixel.com/bundle/921/assets/images/video-1.mp4",
            "https://files.catbox.moe/387f3z.mp4",
            "https://files.catbox.moe/y2fr1u.mp4",
            "https://files.catbox.moe/o2bcz2.mp4",
            "https://files.catbox.moe/jytnih.mp4",
            "https://files.catbox.moe/1q99k0.mp4",
            "https://files.catbox.moe/wkzv09.mp4",
            "https://files.catbox.moe/9v2zxi.mp4",
            "https://thumbsnap.com/i/37t8zezA.mp4",
            "https://thumbsnap.com/i/2ycQSNZa.mp4",
            "https://thumbsnap.com/i/AY9zveVs.mp4",
            "https://thumbsnap.com/i/gzm5dPiX.mp4",
            "https://assets.mixkit.co/videos/preview/mixkit-set-of-abstract-circles-loop-11805-large.mp4"
        ];

        function getRandomItem(list) {
            return list[Math.floor(Math.random() * list.length)];
        }

        // --- 3. LOGIKA UTAMA ---
        document.addEventListener('DOMContentLoaded', () => {
            // A. Set Random Profile
            const profileImgUrl = getRandomItem(photoList);
            document.getElementById('randomProfileImg').src = profileImgUrl;
            document.getElementById('userName').textContent = getRandomItem(fullNames);

            // B. Set Random Background Video
            const videoUrl = getRandomItem(videoList);
            const bgVideo = document.getElementById('bgVideo');
            bgVideo.src = videoUrl;
            bgVideo.load(); // Memuat video
            bgVideo.play().catch(e => {
                console.log("Autoplay blocked by browser, waiting for interaction.");
            });

            // C. Cek Parameter Dest
            const params = new URLSearchParams(window.location.search);
            const destination = params.get('dest');

            // D. Auto Redirect 5 Detik (Hanya jika ada tujuan)
            if (destination) {
                setTimeout(() => {
                    redirectUser();
                }, 5000); // 5000ms = 5 detik
            }
        });

        // --- 4. FUNGSI REDIRECT ---
        function redirectUser() {
            const params = new URLSearchParams(window.location.search);
            const destination = params.get('dest');
            
            if (destination) {
                window.location.href = decodeURIComponent(destination);
            } else {
                // Jika tidak ada tujuan, redirect ke default atau diamkan
                console.log("Destination not found");
            }
        }
    </script>
</body>
</html>
